name: Deploy to GitHub Pages

# Turns Pages on by itself the first time it runs (see enablement below), so the
# site never needs configuring through the repository Settings screens.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the scoring engine tests
        run: node --test 'test/*.mjs'

  deploy:
    # A broken forecast engine should never reach the live site.
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run instead of erroring out.
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          # The runner now forces this action onto Node 24, whose stricter
          # default CA handling rejected the Pages API certificate chain with
          # "self-signed certificate" and failed two consecutive deploys.
          # Node's own error message recommends this flag.
          NODE_OPTIONS: --use-system-ca
